<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>DinoWin Turbo — PixFácil Original</title>
    <link rel="icon" href="/retro-games/_media/dino/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />

    <style>
    body {
      background-color: #f7f7f7;
    }

    header {
      padding-top: 1em;
      text-align: center;
      max-width: 800px;
      margin: auto
    }

    h1 {
      font-size: 2em;
      font-weight: bold
    }

    p {
      line-height: 1.75em;
      font-size: 1em
    }

    #offline-resources {
      display: none
    }

    .interstitial-wrapper {
      color: #2b2b2b;
      font-size: 1em;
      margin: 0 auto;
      max-width: 600px;
      width: 100%
    }

    .runner-container {
      direction: ltr;
      height: 150px;
      max-width: 600px;
      overflow: hidden;
      position: absolute;
      top: 50%;
      transform: translate(0, -50%);
      width: 100%;
    }

    .runner-canvas {
      height: 150px;
      max-width: 600px;
      opacity: 1;
      overflow: hidden;
      position: absolute;
      top: 0;
      z-index: 2
    }

    .controller {
      background: rgba(247, 247, 247, .1);
      height: 100vh;
      left: 0;
      position: absolute;
      top: 0;
      width: 100vw;
    }

    #popup {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      background-color: #bebebe;
      border: 3px dashed #646464;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      margin-top: 0%;
      border-radius: 5%;
      cursor: pointer;
      font-family: 'Press Start 2P', sans-serif;
      color: #3a3a3a;
    }

    #valormoeda1 {
      display: block;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      margin-top: 0%;
      padding: 20px;
      font-family: 'Press Start 2P', sans-serif;
      color: #3a3a3a;
    }
    </style>

    <script src="../_core/poki-sdk-stub.js"></script>
    <script src="../_core/retro-bridge.js"></script>

    <script type="text/javascript">
        // O engine (js/main.js) usa as globais playerSpeed, coinRate,
        // metaMultiplier e bet, e chama winGame()/loseGame() — tudo isso é
        // publicado pelo arcade-bridge.js.
        //
        // Fórmula original do dino, preservada: coinValue = distancia * coinRate,
        // com coinRate cru (sem multiplicar pela aposta).
        // O engine chama loseGame() quando o dino bate. No original o próprio
        // loseGame escondia o botão de encerrar; aqui isso fica neste envelope
        // para o arcade-bridge não precisar conhecer o DOM de cada jogo.
        (function () {
            var perder = window.loseGame;
            window.loseGame = function () {
                var botao = document.getElementById('popup');
                if (botao) { botao.remove(); }
                return perder();
            };
        }());

        Arcade.load().then(function (round) {
            if (!round) { return; }

            document.getElementById('meta').innerText = 'Meta: ' + (bet * metaMultiplier);

            setTimeout(function () {
                var script = document.createElement('script');
                script.src = 'js/main.js';
                document.body.appendChild(script);
            }, 500);
        });
    </script>
<link rel="stylesheet" href="../_core/originals-overlay.css?v=15">
</head>

<body>
    <div id="main-frame-error" class="interstitial-wrapper">
        <img class="icon icon-offline" style="visibility: hidden;"/>
        <div class="runner-container" style="width: 600px; height: 150px;">
            <canvas class="runner-canvas" width="600" height="150"></canvas>
        </div>
    </div>

    <div id="offline-resources">
        <div id="offline-resources-1x">
            <img id="1x-obstacle-large" src="img/1x-obstacle-large.png">
            <img id="1x-obstacle-small" src="img/1x-obstacle-small.png">
            <img id="1x-cloud" src="img/1x-cloud.png">
            <img id="1x-text" src="img/1x-text.png">
            <img id="1x-horizon" src="img/1x-horizon.png">
            <img id="1x-trex" src="img/1x-trex.png">
            <img id="1x-restart" src="img/1x-restart.png">
        </div>
        <div id="offline-resources-2x">
            <img id="2x-obstacle-large" src="img/2x-obstacle-large.png">
            <img id="2x-obstacle-small" src="img/2x-obstacle-small.png">
            <img id="2x-cloud" src="img/2x-cloud.png">
            <img id="2x-text" src="img/2x-text.png">
            <img id="2x-horizon" src="img/2x-horizon.png">
            <img id="2x-trex" src="img/2x-trex.png">
            <img id="2x-restart" src="img/2x-restart.png">
        </div>
    </div>
    <div id="audio-resources">
        <audio id="offline-sound-press" src="sounds/offline-sound-press.mp3"></audio>
        <audio id="offline-sound-hit" src="sounds/offline-sound-hit.mp3"></audio>
        <audio id="offline-sound-reached" src="sounds/offline-sound-reached.mp3"></audio>
    </div>

    <form id="formAposta" onsubmit="encerrarAposta(event)">
        <input type="hidden" id="valuecoin" name="valuecoin" value=""/>
        <button type="submit" id="popup">
            Encerrar Aposta
        </button>
    </form>
    <span id="valormoeda1"></span>
    <span id="meta"></span>

    <script>
    function encerrarAposta(event) {
        event.preventDefault();

        var acumulado = document.getElementById('valuecoin').value;

        // Mesma protecao do loseGame acima: o popup pode nao estar mais la,
        // e a excecao engoliria o winGame — a rodada ficaria aberta.
        var popup = document.getElementById('popup');
        if (popup) { popup.remove(); }

        winGame(Number(acumulado));
    }
    </script>
<script src="../_core/originals-overlay.js?v=15"></script>
</body>

</html>
