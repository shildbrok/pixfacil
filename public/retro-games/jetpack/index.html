	<script>
		function alertMessage(type, message) {

	<!--
		jQuery é servido daqui (_arcade/jquery.min.js) e não de CDN: o game3.js
		usa $.ajax para liquidar a rodada, e uma partida valendo dinheiro não
		deveria depender de rede de terceiros para pagar o jogador.

		Precisa vir ANTES do bloco de ajaxSetup abaixo. O game3.js pode ficar
		depois porque as chamadas dele rodam dentro de DOMContentLoaded.
	-->
	<script type="text/javascript" src="../_core/jquery.min.js"></script>

	<script>
		/*
		 * game3.js faz POST em /api/retro/engine/jetpack/win via $.ajax, que não
		 * manda o token CSRF por conta própria. Registrando o header aqui, os
		 * POST do jogo continuam passando pela proteção CSRF do Laravel.
		 */
		(function () {
			var csrf = new URLSearchParams(window.location.search).get('csrf') || '';
			$.ajaxSetup({ headers: { 'X-CSRF-TOKEN': csrf } });
		}());
	</script>

	<script type="text/javascript" src="engine/phaser-3.24.1.min.js"></script>
	<script type="text/javascript" src="game3.js"></script>

	<style>
		* {

		.container-btn-stop-game {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: fit-content;
			height: fit-content;
			display: none;
			z-index: 10;

		.cont-stop-game {
			position: relative;
			width: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.btn-stop-game {
			width: 5.25rem;
			height: fit-content;
			background-color: #F95F5F;
			border-radius: 10px;
			box-shadow: 0 0 10px 0 #000;
			color: #fff;
			font-family: monospace;
			z-index: 10;
			transition: .3s;
			animation: pulse 1s infinite;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			cursor: pointer;
			user-select: none;
			text-align: center;
			font-size: 1.45rem;
			font-weight: bold;
			opacity: .85;
			padding: .45rem 1rem;
		}

		.btn-stop-game svg {
			width: 3.5rem;
			height: auto;
			transition: .3s;
			transform: rotate(330deg);
		}

		.btn-stop-game svg path {
			fill: #fff;
		}

		.btn-stop-game:hover {
			transform: scale(1.1);
			background-color: #8BFD6A;
			opacity: 1;
		}

		.container-boxes-info {
			position: absolute;
			bottom: 20%;
			left: 0;
			width: 100%;
			height: fit-content;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			z-index: 10;
			user-select: none;
			pointer-events: none;
		}

		.container-fill-meta {
			width: 100%;
			height: fit-content;
		}

		.into-container-fill-meta {
			position: relative;
			width: 100%;
			height: fit-content;
			z-index: 999;

		.meta-card {

			z-index: 10;

			text-align: center;
			border-radius: .25rem;
			box-shadow: 0 0 12px 0 rgba(0, 0, 0, .8);
			font-size: 1rem;
		}

		.container-fill-gain {
			width: 100%;
			height: fit-content;
		}

		.into-container-fill-gain {
			position: relative;
			width: 100%;
			height: fit-content;
			z-index: 999;
		}

		.meta-card-gain {
			width: fit-content;
			background-color: #3A67E1;
			color: #fff;
			font-family: monospace;
			z-index: 10;
			padding: .25rem 2rem;
			margin: .15rem 0;
			text-align: center;
			border-radius: .25rem;
			box-shadow: 0 0 12px 0 rgba(0, 0, 0, .8);
			font-size: 1rem;
		}
	</style>
